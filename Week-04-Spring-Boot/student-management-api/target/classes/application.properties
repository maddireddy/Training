# Student Management API - Configuration
# Week 4: Spring Boot Training

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8080
spring.application.name=student-management-api

# ==========================================
# H2 DATABASE CONFIGURATION
# ==========================================
# H2 is an in-memory database (data is lost when app stops)
# Perfect for learning and development

spring.datasource.url=jdbc:h2:mem:studentdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
# DDL Auto: create-drop (recreate tables on each run)
# Other options: update, create, validate, none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL queries in console (for learning)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# H2 CONSOLE (Database UI)
# ==========================================
# Access at: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:studentdb
# Username: sa
# Password: (leave blank)

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# LOGGING
# ==========================================
logging.level.root=INFO
logging.level.com.training.studentapi=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ==========================================
# PRODUCTION DATABASE (MySQL/PostgreSQL)
# ==========================================
# Uncomment and configure for production

## MySQL
# spring.datasource.url=jdbc:mysql://localhost:3306/studentdb
